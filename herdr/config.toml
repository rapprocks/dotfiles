onboarding = false
[keys]

# Rebind tmux prefix from C-b -> C-a
prefix = "ctrl+a"

# Same as: bind a send-prefix
# (Herdr already keeps prefix behavior internally; no equivalent needed)

# Reload config: tmux "bind r source-file ~/.config/tmux/tmux.conf"
reload_config = "prefix+r"

# Vim-like pane navigation
focus_pane_up = "prefix+k"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"

split_horizontal = 'prefix+"'
split_vertical = 'prefix+%'

# Last window equivalent
last_pane = "prefix+^"

# Preserve tmux muscle memory
next_tab = "prefix+n"
previous_tab = "prefix+p"

# Scratchpad toggle
# See custom command below

[theme]
name = "rose-pine"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[theme.custom]
sidebar_bg = "#181818"
panel_bg = "#181818"
accent = "#ebbcba"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"
