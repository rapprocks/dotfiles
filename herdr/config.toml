onboarding = false
[keys]

# Rebind tmux prefix from C-b -> C-a
prefix = "ctrl+a"

# Same as: bind a send-prefix
# (Herdr already keeps prefix behavior internally; no equivalent needed)

# Reload config: tmux "bind r source-file ~/.config/tmux/tmux.conf"
reload_config = "prefix+r"

# Vim-like pane navigation
focus_pane_up = "prefix+k"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"

split_horizontal = 'prefix+"'
split_vertical = 'prefix+%'

# Last window equivalent
last_pane = "prefix+^"

# Preserve tmux muscle memory
next_tab = "prefix+n"
previous_tab = "prefix+p"

goto = "prefix+s"

# Scratchpad toggle
# See custom command below

[theme]
name = "rose-pine"
# Follow Alacritty: herdr infers light/dark from the terminal background,
# which theme-switcher swaps via ~/.config/alacritty/colors.toml.
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

# Shared: use the terminal's own background instead of the theme's base.
# sidebar_bg is left unset, so the sidebar also keeps the terminal background.
[theme.custom]
panel_bg = "reset"

[theme.custom.dark]
accent = "#ebbcba" # rose

[theme.custom.light]
accent = "#d7827e" # rose (dawn)

[ui]
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[ui.toast]
delivery = "system"
